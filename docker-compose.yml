version: '3.8'

services:
  db:
    image: postgres:15
    container_name: internsight_db
    environment:
      POSTGRES_USER: internsight
      POSTGRES_PASSWORD: internsight123
      POSTGRES_DB: internsight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: